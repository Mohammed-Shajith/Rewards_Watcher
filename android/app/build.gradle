plugins {
    id "com.android.application"
}

// Release signing: the maintainer's key lives outside the repo, in
// ~/.android/rewardswatcher-release.properties (or $RW_SIGNING_PROPS).
// Without it, release builds fall back to your local debug key.
def signingProps = new Properties()
def signingFile = file(System.getenv("RW_SIGNING_PROPS") ?: "${System.getProperty("user.home")}/.android/rewardswatcher-release.properties")
if (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }

android {
    namespace "io.github.mohammedshajith.rewardswatcher"
    compileSdk 36

    defaultConfig {
        applicationId "io.github.mohammedshajith.rewardswatcher"
        minSdk 29          // Android 10+
        targetSdk 35       // Android 15
        versionCode 3
        versionName "3.0.0"
    }

    signingConfigs {
        release {
            if (signingProps["storeFile"]) {
                storeFile file(signingProps["storeFile"])
                storePassword signingProps["storePassword"]
                keyAlias signingProps["keyAlias"]
                keyPassword signingProps["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig signingProps["storeFile"] ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }
}

// No dependencies on purpose: only what Android already ships.
dependencies {
}
